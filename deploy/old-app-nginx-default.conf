upstream django_backend {
    server inventory_to_logistic:5000;
}

# -----------------------------------------------------------------------------
# HTTP — existing app (dev.f4ip.com)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name dev.f4ip.com;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTP — new app (apps.f4ip.com) — ACME + redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name apps.f4ip.com;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS — existing app (dev.f4ip.com)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name www.dev.f4ip.com dev.f4ip.com;

    ssl_certificate /etc/letsencrypt/live/dev.f4ip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.f4ip.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5000M;

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    access_log /var/log/nginx/nignx-access.log;
    error_log /var/log/nginx/nginx-error.log;

    location /static/ {
        alias /opt/staticfiles/;
    }

    location /media/ {
        alias /opt/mediafiles/;
    }

    location / {
        return 301 /admin;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# -----------------------------------------------------------------------------
# HTTPS — new app (apps.f4ip.com)
# Proxies to dear_shopify_sync nginx on host 127.0.0.1:8080
# Requires old compose nginx service:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# IMPORTANT: Obtain the SSL cert BEFORE enabling this block, or nginx will
# fail to start if the cert files are missing:
#   docker-compose run --rm --entrypoint certbot certbot certonly \
#     --webroot -w /var/www/certbot \
#     --email shahnewaz@sgcsoft.net \
#     --agree-tos --no-eff-email --non-interactive \
#     -d apps.f4ip.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name apps.f4ip.com;

    ssl_certificate /etc/letsencrypt/live/apps.f4ip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.f4ip.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    access_log /var/log/nginx/apps-f4ip-access.log;
    error_log /var/log/nginx/apps-f4ip-error.log;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
