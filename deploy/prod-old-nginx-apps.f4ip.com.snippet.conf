# =============================================================================
# PRODUCTION DROPLET (front app serves f4ip.com)
#
# APPEND these two server blocks to the EXISTING app's nginx config, e.g.
#   <old_app>/nginx/default.conf
# Leave all existing f4ip.com / www.f4ip.com blocks untouched.
#
# Also add to the EXISTING app's docker-compose.yml under the nginx service:
#
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# Order matters: install the HTTP block first, reload nginx, issue the cert,
# THEN add the HTTPS block and reload again. nginx refuses to start if it
# references certificate files that do not exist yet.
# =============================================================================

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------
server {
    listen 80;
    server_name apps.f4ip.com;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: terminate TLS, proxy to dear_shopify_sync nginx on host :8080 ---
server {
    listen 443 ssl;
    server_name apps.f4ip.com;

    ssl_certificate /etc/letsencrypt/live/apps.f4ip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.f4ip.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;

    access_log /var/log/nginx/apps-f4ip-access.log;
    error_log /var/log/nginx/apps-f4ip-error.log;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
