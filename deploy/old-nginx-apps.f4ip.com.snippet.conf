# =============================================================================
# ADD THESE BLOCKS to the OLD app: nginx/default.conf
# Keep all existing dev.f4ip.com blocks unchanged.
# =============================================================================

# --- HTTP: ACME + redirect for apps.f4ip.com ---
server {
    listen 80;
    server_name apps.f4ip.com;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: terminate SSL here, proxy to new app on host :8080 ---
server {
    listen 443 ssl;
    server_name apps.f4ip.com;

    ssl_certificate /etc/letsencrypt/live/apps.f4ip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.f4ip.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}

