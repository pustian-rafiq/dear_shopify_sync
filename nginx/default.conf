upstream django_backend {
    server dear_to_shopify:5000;
}

# HTTP only — public TLS is terminated by the existing front nginx on this
# droplet (the stack that owns ports 80/443). This container is published on
# host port 8080 and is reached as host.docker.internal:8080.
server {
    listen 80;
    server_name apps.f4ip.com;

    client_max_body_size 100M;

    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /static/ {
        alias /opt/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /opt/mediafiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust proto from outer (old) nginx; default to http if missing
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
